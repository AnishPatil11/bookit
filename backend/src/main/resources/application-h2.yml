# Zero-setup profile: in-memory H2 database, same Flyway migrations (minus the PostgreSQL-only constraint).
# Run with:  mvn spring-boot:run -Dspring-boot.run.profiles=h2
spring:
  datasource:
    url: jdbc:h2:mem:bookit;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    locations: classpath:db/migration
