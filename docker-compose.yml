# Whole stack with one command:  docker compose up --build
# Then open http://localhost:3000   (API docs: http://localhost:8080/swagger-ui.html)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bookit
      POSTGRES_USER: bookit
      POSTGRES_PASSWORD: bookit
    ports:
      - "5432:5432"
    volumes:
      - bookit-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookit -d bookit"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/bookit
      DB_USER: bookit
      DB_PASSWORD: bookit
      JWT_SECRET: change-this-to-a-long-random-string-before-deploying
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  bookit-db:
